name: jeju_oreum
description: "제주 오름 탐방 앱 - 새 디자인"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  supabase_flutter: ^1.10.0
  flutter_map: ^6.1.0
  flutter_map_marker_cluster: ^1.3.6
  latlong2: ^0.9.1
  location: ^5.0.0
  geolocator: ^10.1.0
  url_launcher: ^6.2.2
  flutter_cache_manager: ^3.3.1
  cached_network_image: ^3.3.1
  path_provider: ^2.1.2
  connectivity_plus: ^5.0.2
  webview_flutter: ^4.4.2
  kakao_flutter_sdk: ^1.9.5
  csv: ^5.0.2
  provider: ^6.1.1
  flutter_tts: ^3.8.5
  flutter_background_service: ^5.0.5
  path: ^1.8.3
  intl: ^0.18.1
  shared_preferences: ^2.2.2
  # flutter_local_notifications: ^15.1.0  # Temporarily disabled due to Android 29 compatibility issue
  workmanager: ^0.5.1
  flutter_svg: ^2.0.10+1
  flutter_dotenv: ^5.1.0
  sliding_up_panel: ^2.0.0+1
  image_picker: ^1.0.7
  permission_handler: ^11.3.0
  share_plus: ^7.2.2

dependency_overrides:
  app_links: ^3.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/categories/
    - assets/data/

  fonts:
    - family: NanumGothic
      fonts:
        - asset: fonts/NanumGothic-Regular.ttf
        - asset: fonts/NanumGothic-Bold.ttf
          weight: 700
        - asset: fonts/NanumGothic-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
